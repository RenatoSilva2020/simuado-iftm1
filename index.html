                text: "Em um mapa cuja escala cartográfica é de 1:5.000.000, a distância em linha reta entre duas cidades medidas com uma régua no papel é de 6 centímetros. Qual é a distância real em linha reta entre essas duas cidades?",
                options: [
                    { text: "30 quilômetros", isCorrect: false },
                    { text: "300 quilômetros", isCorrect: true }, 
                    { text: "3.000 quilômetros", isCorrect: false },
                    { text: "50 quilômetros", isCorrect: false },
                    { text: "500 quilômetros", isCorrect: false }
                ]
            },
            {
                discipline: "Geografia",
                text: "O conceito de saldo migratório é a diferença entre o número de imigrantes (pessoas que chegam a um estado) e o de emigrantes (pessoas que saem). Se um estado brasileiro possui 400.000 imigrantes e 250.000 emigrantes em certo período, pode-se concluir que:",
                options: [
                    { text: "O estado possui um saldo migratório negativo, indicando repulsão populacional.", isCorrect: false },
                    { text: "O estado apresenta um saldo migratório positivo de 150.000 pessoas, o que atrai mais habitantes do que perde.", isCorrect: true },
                    { text: "A taxa de fecundidade desse estado sofreu queda drástica devido à saída de pessoas.", isCorrect: false },
                    { text: "O saldo migratório é neutro (zero), pois quem entra substitui quem sai proporcionalmente.", isCorrect: false },
                    { text: "Houve uma fuga de cérebros de exatos 650.000 habitantes na região.", isCorrect: false }
                ]
            },
            {
                discipline: "Geografia",
                text: "Ao se analisar as mesorregiões do estado de Minas Gerais, a região do Triângulo Mineiro e Alto Paranaíba se destaca nacionalmente. Sua principal força geográfica e econômica atual se dá por:",
                options: [
                    { text: "Estar no extremo oriente do estado, sendo a ponte de exportação portuária para o Espírito Santo.", isCorrect: false },
                    { text: "Ser o maior polo petroquímico e pesqueiro de água salgada do país.", isCorrect: false },
                    { text: "Localizar-se na porção mais ocidental (oeste) do estado, com relevo favorável e destaque para o agronegócio altamente mecanizado (soja, cana-de-açúcar, pecuária).", isCorrect: true },
                    { text: "Sobreviver exclusivamente do turismo histórico colonial e da extração manual de esmeraldas.", isCorrect: false },
                    { text: "Possuir o clima mais gélido do Brasil, atraindo grande migração do Nordeste.", isCorrect: false }
                ]
            }
        ];

        // Definindo a ordem rigorosa das disciplinas conforme edital/PDF
        const disciplineOrder = ["Língua Portuguesa", "Matemática", "Ciências", "História", "Geografia"];

        // Função utilitária para embaralhar um array (Fisher-Yates)
        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        let orderedAndShuffledQuestions = [];

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = ""; 
            orderedAndShuffledQuestions = []; // reset

            let globalQuestionIndex = 1;

            // Agrupa e embaralha as questões de acordo com a ordem FIXA das disciplinas
            disciplineOrder.forEach(disciplineName => {
                // Filtra as questões que pertencem a esta disciplina
                let questionsOfDiscipline = questionsData.filter(q => q.discipline === disciplineName);
                
                // Embaralha as questões APENAS dentro do seu bloco de disciplina
                questionsOfDiscipline = shuffleArray(questionsOfDiscipline);

                if(questionsOfDiscipline.length > 0) {
                    // Título da Disciplina
                    let sectionTitle = document.createElement('h2');
                    sectionTitle.className = 'discipline-section';
                    sectionTitle.innerText = disciplineName;
                    container.appendChild(sectionTitle);

                    questionsOfDiscipline.forEach(q => {
                        // Salva na lista global para fácil correção depois
                        orderedAndShuffledQuestions.push(q);

                        // Embaralha as alternativas desta questão específica
                        let shuffledOptions = shuffleArray([...q.options]);

                        let qDiv = document.createElement('div');
                        qDiv.className = 'question-card';
                        
                        let questionHTML = `
                            <h3>Questão ${globalQuestionIndex}</h3>
                            <p>${q.text}</p>
                            <ul class="options">
                        `;

                        shuffledOptions.forEach((opt, optIndex) => {
                            // A lógica de input name usa o índice global para recuperar os dados depois
                            questionHTML += `
                                <li>
                                    <label>
                                        <input type="radio" name="q${globalQuestionIndex}" value="${opt.isCorrect}" required>
                                        ${opt.text}
                                    </label>
                                </li>
                            `;
                        });

                        questionHTML += `</ul>`;
                        qDiv.innerHTML = questionHTML;
                        container.appendChild(qDiv);
                        
                        globalQuestionIndex++;
                    });
                }
            });
        }

        function calculateResults() {
            // Verifica se respondeu todas (básico)
            const form = document.getElementById('quizForm');
            const formData = new FormData(form);
            
            let answersCount = 0;
            for(let key of formData.keys()) {
                answersCount++;
            }

            if(answersCount < orderedAndShuffledQuestions.length) {
                alert("Por favor, responda a todas as questões antes de finalizar o simulado.");
                return;
            }

            let scores = {};
            disciplineOrder.forEach(d => {
                scores[d] = { correct: 0, total: 0 };
            });

            let totalCorrect = 0;
            let totalQuestions = orderedAndShuffledQuestions.length;

            orderedAndShuffledQuestions.forEach((q, index) => {
                let questionNumber = index + 1;
                let answer = formData.get(`q${questionNumber}`);
                
                scores[q.discipline].total += 1;
                
                if (answer === "true") {
                    scores[q.discipline].correct += 1;
                    totalCorrect += 1;
                }
            });

            // Oculta o formulário de perguntas
            form.style.display = 'none';
            document.querySelector('.header-info').style.display = 'none';
            
            // Exibe os resultados
            const resultContainer = document.getElementById('result-container');
            const resultsList = document.getElementById('resultsList');
            
            let html = `
                <div class="result-item total">
                    <span>Acertos Totais:</span>
                    <span>${totalCorrect} de ${totalQuestions} (${Math.round((totalCorrect/totalQuestions)*100)}%)</span>
                </div>
                <h3>Desempenho por Disciplina:</h3>
            `;

            disciplineOrder.forEach(discipline => {
                let data = scores[discipline];
                if(data.total > 0) {
                    let percentage = Math.round((data.correct / data.total) * 100);
                    let color = percentage >= 60 ? 'green' : (percentage >= 40 ? 'orange' : 'red');
                    html += `
                        <div class="result-item">
                            <span><strong>${discipline}</strong></span>
                            <span>
                                ${data.correct} / ${data.total} 
                                <span style="color:${color}; font-weight:bold; margin-left: 10px;">(${percentage}%)</span>
                            </span>
                        </div>
                    `;
                }
            });

            resultsList.innerHTML = html;
            resultContainer.style.display = 'block';
            window.scrollTo(0, 0);
        }

        // Renderiza o simulado assim que a janela é carregada
        window.onload = renderQuiz;
    </script>
</body>
</html>
